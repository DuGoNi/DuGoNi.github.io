<h1>배리스터 쇼트키 장벽의 온도 의존성 이상을 규명했다</h1>
<div class="date">2026.08</div>
<p>배리스터 소자의 리처드슨 해석에서 이론값과 어긋나는 구간이 오래 걸려 있었다. 후보를 하나씩 지워 가며 남은 결론은 하나 — 겉보기 장벽 높이 <i class="en">Φ_app(T)</i>가 온도와 함께 올라간다는 것. 장벽이 온도에 따라 움직이면, 고정 장벽을 전제한 리처드슨 좌표는 휘어 보일 수밖에 없다.</p>
<p>«원인 아님» 목록을 함께 남겼다. 지운 후보들의 기록이 다음 어긋남에서 걸음을 아껴 준다.</p>
