*{box-sizing:border-box}

body{margin:0;background:#fff;color:var(--fg);line-height:var(--u);word-break:keep-all;-webkit-font-smoothing:antialiased}

p{margin:0 0 var(--u);text-wrap:pretty}

.seal{margin-top:calc(var(--u)*1.5);padding-top:calc(var(--u)*.6);position:relative;font-family:var(--mono);font-size:.64rem;color:var(--mut)}
