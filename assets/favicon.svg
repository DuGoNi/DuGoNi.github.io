<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="사이트 아이콘">
  <!-- 색을 쓰지 않는다. 잉크의 농도만 남긴다 — 네 줄이 exp(−3x)로 잦아든다.
       바탕이 종이색이라 밝은 탭에서도 어두운 탭에서도 형태가 보인다. -->
  <rect width="64" height="64" rx="13" fill="#F2EFE7"/>
  <g fill="#15140F">
    <rect x="12" y="14" width="40" height="6" opacity="1"/>
    <rect x="12" y="26" width="32" height="6" opacity=".55"/>
    <rect x="12" y="38" width="23" height="6" opacity=".30"/>
    <rect x="12" y="50" width="16" height="6" opacity=".16"/>
  </g>
</svg>
